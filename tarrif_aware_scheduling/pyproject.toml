[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcopt"
version = "0.1.0"
description = "HPC demand/energy-aware scheduler pipeline"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.23", "pyyaml>=6.0"]

[project.scripts]
hpcopt = "hpcopt.part_a:main"   # for now, points to Part A CLI

